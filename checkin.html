<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Staff Check-in | CRA Press Tour 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Noto Sans Thai', sans-serif; 
      background-color: #0f172a; 
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .checkin-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .digit-input {
      width: 100%;
      text-align: center;
      font-size: 4rem;
      font-weight: 900;
      color: #38bdf8;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 1.5rem;
      padding: 1rem;
      outline: none;
      transition: all 0.3s ease;
      letter-spacing: 5px;
    }
    .digit-input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
    }
    .digit-input::placeholder {
      color: #334155;
      font-size: 3rem;
    }
    /* ซ่อนลูกศรขึ้นลงใน input type number */
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }
    .modern-popup { border-radius: 24px !important; font-family: 'Noto Sans Thai', sans-serif !important; }
  </style>
</head>
<body>

  <div class="checkin-card relative overflow-hidden">
    <!-- แถบตกแต่ง -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-sky-400"></div>

    <div class="w-16 h-16 bg-sky-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-sky-500/20">
      <i class="fi fi-sr-id-badge text-3xl text-sky-400 mt-1"></i>
    </div>
    
    <h1 class="text-2xl font-black mb-1">ระบบเช็คอินหน้างาน</h1>
    <p class="text-slate-400 text-sm mb-8">พิมพ์เลขรหัส 3 หลักเพื่อเช็คอิน</p>

    <form id="checkinForm" onsubmit="handleCheckin(event)">
      <div class="mb-6 relative">
        <span class="absolute left-6 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-500">PT-</span>
        <!-- บังคับให้ใส่แค่ตัวเลข และดึง Keypad ตัวเลขขึ้นมาในมือถือ -->
        <input type="number" id="idCode" class="digit-input pl-16" placeholder="000" required autocomplete="off" pattern="\d*">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-sky-500 text-white font-black text-lg py-4 rounded-[1.25rem] shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transition-all flex items-center justify-center gap-2">
        ยืนยันการเช็คอิน <i class="fi fi-sr-check-circle mt-1"></i>
      </button>
    </form>
    
    <div class="mt-8 border-t border-slate-700 pt-6">
       <a href="index.html" class="text-slate-400 text-sm hover:text-white transition"><i class="fi fi-sr-home mr-1"></i> กลับหน้าหลัก</a>
    </div>
  </div>

  <script>
    // ⚠️ นำ URL Google Apps Script ล่าสุด (ที่ได้จากการ Deploy ใหม่) มาใส่ที่นี่
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMpDknYK1gG5ehnBGUdBJjpO3JgYg3i2tdOVpCS86mDDZQHoa4-8Eb-tqbJx9juqhq/exec";

    function handleCheckin(e) {
      e.preventDefault();
      const codeInput = document.getElementById('idCode');
      const btn = document.getElementById('submitBtn');
      const codeVal = codeInput.value.trim();

      if (!codeVal) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fi fi-sr-spinner animate-spin text-xl"></i> กำลังตรวจสอบ...';
      btn.classList.add('opacity-70');

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          formType: 'checkin',
          code: codeVal
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerHTML = 'ยืนยันการเช็คอิน <i class="fi fi-sr-check-circle mt-1"></i>';
        btn.classList.remove('opacity-70');

        if (data.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'เช็คอินสำเร็จ!',
            html: `ยินดีต้อนรับ<br><strong class="text-xl text-blue-600 mt-2 block">${data.name}</strong>`,
            timer: 2000,
            showConfirmButton: false,
            customClass: { popup: 'modern-popup' }
          }).then(() => {
            codeInput.value = '';
            codeInput.focus(); // โฟกัสช่องกรอกอัตโนมัติ เพื่อให้พิมพ์คนต่อไปได้เลย
          });
        } 
        else if (data.status === 'already') {
          Swal.fire({
            icon: 'warning',
            title: 'เช็คอินไปแล้ว',
            html: `<strong class="text-orange-500">${data.name}</strong><br>ได้ทำการเช็คอินเข้าระบบไปก่อนหน้านี้แล้ว`,
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#0f172a',
            customClass: { popup: 'modern-popup' }
          }).then(() => {
            codeInput.value = '';
            codeInput.focus();
          });
        } 
        else {
          Swal.fire({
            icon: 'error',
            title: 'ไม่พบข้อมูล',
            text: `ไม่มีหมายเลขลงท้าย ${codeVal} ในระบบ กรุณาตรวจสอบอีกครั้ง`,
            confirmButtonText: 'ลองใหม่',
            confirmButtonColor: '#ef4444',
            customClass: { popup: 'modern-popup' }
          }).then(() => {
            codeInput.focus();
            codeInput.select(); // คลุมดำข้อความเดิมเพื่อให้พิมพ์ทับได้เลย
          });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = 'ยืนยันการเช็คอิน <i class="fi fi-sr-check-circle mt-1"></i>';
        btn.classList.remove('opacity-70');
        Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง', text: 'กรุณาลองใหม่อีกครั้ง' });
      });
    }

    // Auto-focus เมื่อเปิดหน้าเว็บ
    window.onload = () => {
      document.getElementById('idCode').focus();
    };
  </script>
</body>
</html>
