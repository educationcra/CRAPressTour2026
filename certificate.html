<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>รับเกียรติบัตร - CRA Education Press Tour 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; background: #f8fafc; color: #0f172a; }
    .main-card { background: #ffffff; border-radius: 2rem; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05); }
    .input-field, .c-select-trigger { width: 100%; padding: 1rem 1.25rem; border-radius: 1rem; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; font-weight: 600; font-size: 0.95rem; }
    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; transition: 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -8px rgba(37, 99, 235, 0.5); }
    
    .c-select-container { position: relative; width: 100%; user-select: none; }
    .c-select-dropdown { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); z-index: 1000; max-height: 250px; overflow-y: auto; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.2s; }
    .c-select-container.open .c-select-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .c-select-option { padding: 1rem; font-weight: 600; color: #475569; cursor: pointer; border-bottom: 1px solid #f8fafc; }
    .c-select-option:hover { background: #eff6ff; color: #1d4ed8; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="main-card w-full max-w-lg p-8 md:p-10 text-center relative z-10 overflow-hidden">
    <!-- Decor -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-500 rounded-full blur-[80px] opacity-20"></div>

    <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6">
        <i class="fi fi-sr-diploma text-4xl mt-2"></i>
    </div>
    
    <h1 class="text-3xl font-black mb-2 text-slate-800">ค้นหาเกียรติบัตร</h1>
    <p class="text-slate-500 font-medium mb-8">กรอกชื่อ-นามสกุล เพื่อดาวน์โหลดเกียรติบัตรของท่าน</p>

    <div id="searchForm" class="space-y-4 text-left">
        <input type="text" id="fname" class="input-field" placeholder="ชื่อจริง">
        <input type="text" id="lname" class="input-field" placeholder="นามสกุล">
        
        <button id="btnSearch" onclick="searchCert()" class="w-full btn-primary py-4 rounded-2xl font-black text-lg mt-4 flex justify-center items-center gap-2">
            ค้นหาเกียรติบัตร <i class="fi fi-sr-search"></i>
        </button>
    </div>

    <!-- ผลลัพธ์ -->
    <div id="resultArea" class="hidden mt-8 pt-8 border-t border-slate-100">
        <h3 class="text-xl font-black text-slate-800 mb-4 flex items-center justify-center gap-2">
            <i class="fi fi-sr-diploma text-blue-500"></i> เกียรติบัตรของคุณ
        </h3>
        
        <div id="certImageContainer" class="w-full bg-slate-50 rounded-2xl mb-6 overflow-hidden border border-slate-200 aspect-[1.414/1] relative shadow-inner">
             <iframe id="certImagePreview" src="" class="absolute top-0 left-0 w-full h-full border-0" loading="lazy"></iframe>
        </div>

        <a id="downloadLink" href="#" target="_blank" class="w-full btn-primary flex justify-center items-center gap-2 py-4 rounded-2xl font-black no-underline shadow-lg shadow-blue-500/30 text-lg">
            ดาวน์โหลดไฟล์ <i class="fi fi-sr-download mt-1"></i>
        </a>
        <button onclick="resetSearch()" class="mt-6 w-full text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors">ค้นหาชื่ออื่น</button>
    </div>

  </div>

  <script>
    // ⚠️ เปลี่ยน URL ด้านล่างเป็นของคุณหลังจาก Deploy ใหม่
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykFgI9EFqWAg4duDg1jnPKRSom7Y0rJw6nxKx1dSPhpB8JRdUjAb9Dld4X9x7RnaLw/exec";

    function searchCert() {
        const fname = document.getElementById('fname').value.trim();
        const lname = document.getElementById('lname').value.trim();

        if(!fname || !lname) return Swal.fire({icon:'warning', title:'เตือน', text:'กรุณากรอกชื่อและนามสกุลให้ครบถ้วน'});

        const fullName = fname + " " + lname;
        const btn = document.getElementById('btnSearch');
        btn.disabled = true; btn.innerHTML = '<i class="fi fi-sr-spinner animate-spin"></i> กำลังค้นหา...';

        fetch(SCRIPT_URL + "?action=getCertificate&name=" + encodeURIComponent(fullName))
        .then(res => res.json())
        .then(data => {
            btn.disabled = false; btn.innerHTML = 'ค้นหาเกียรติบัตร <i class="fi fi-sr-search mt-1"></i>';
            if(data.status === 'success') {
                document.getElementById('searchForm').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
                
                // แปลงลิงก์ Drive สำหรับ Preview
                let previewUrl = data.url;
                if(previewUrl) {
                    previewUrl = previewUrl.replace('view?usp=drivesdk', 'preview');
                }
                document.getElementById('certImagePreview').src = previewUrl;
                document.getElementById('downloadLink').href = data.downloadUrl;
            } else {
                Swal.fire({
                    icon:'error', 
                    title:'ไม่พบข้อมูล', 
                    text:'ไม่พบเกียรติบัตรที่ตรงกับชื่อนี้ โปรดตรวจสอบตัวสะกดอีกครั้ง',
                    customClass: { popup: 'modern-popup', confirmButton: 'modern-btn-confirm' }
                });
            }
        }).catch(err => {
            btn.disabled = false; btn.innerHTML = 'ค้นหาเกียรติบัตร <i class="fi fi-sr-search"></i>';
            Swal.fire({
                icon:'error', 
                title:'ข้อผิดพลาด', 
                text:'ไม่สามารถเชื่อมต่อระบบได้',
                customClass: { popup: 'modern-popup', confirmButton: 'modern-btn-confirm' }
            });
        });
    }

    function resetSearch() {
        document.getElementById('searchForm').classList.remove('hidden');
        document.getElementById('resultArea').classList.add('hidden');
        document.getElementById('fname').value = "";
        document.getElementById('lname').value = "";
    }
  </script>
</body>
</html>
